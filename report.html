<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing report · Summer Writing Squad</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/squad.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="wrap">
    <div class="kicker">Coach report</div>
    <div id="report"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/app.js"></script>
  <script>
    window.onSquadReady = async function () {
      const params = Squad.params();
      let result = null;
      if (params.get("id") && Squad.user) {
        result = await Squad.api("/api/assessments/" + params.get("id"));
      } else {
        result = JSON.parse(sessionStorage.getItem("squad-result") || "null");
      }
      const root = document.getElementById("report");
      if (!result) {
        root.innerHTML = '<p class="lede">No report yet. <a href="write.html">Write a piece</a> and we’ll score it.</p>';
        return;
      }
      const constructs = (result.constructs || []).map((c) => `
        <article class="card">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <h2>${c.name}</h2>
            <div class="level level-${c.score}">${c.label}</div>
          </div>
          <p style="margin:8px 0 12px">${c.kid_note}</p>
          ${(c.standards || []).map((s) => `<div class="standard-row"><code>${s.code}</code> — ${s.text}</div>`).join("")}
        </article>`).join("");
      root.innerHTML = `
        <div class="score-hero">
          <div class="score-badge">${result.overall}<span>${result.overall_label}</span></div>
          <div>
            <h1 class="page-title" style="color:white">${result.prompt_title || "Your writing"}</h1>
            <p>Scored for ${result.state_name}, grade ${result.grade}, ${result.genre} writing.</p>
            <p class="muted" style="color:#AFA9EC;margin-top:8px">${result.framework} · ${result.word_count} words · ${result.sentence_count} sentences</p>
          </div>
        </div>
        <p class="lede" style="margin:1.25rem 0">${result.framework_note}</p>
        <div class="grid" style="gap:16px">${constructs}</div>
        <p style="margin-top:1.5rem">
          <a class="btn btn-primary" href="write.html">Write another</a>
          <a class="btn btn-secondary" href="account.html" style="margin-left:8px">Save progress</a>
        </p>`;
    };
  </script>
</body>
</html>
