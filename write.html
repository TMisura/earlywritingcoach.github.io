<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit writing · Early Writing Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/coach.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="wrap">
    <div class="kicker">Any school assignment</div>
    <h1 class="page-title">Paste the writing. We will not keep it.</h1>
    <p class="lede">Use homework, a printed booklet page, or anything the child already wrote. After you submit, save the coaching note — the sample itself is discarded.</p>
    <div class="card" style="margin-top:1.4rem">
      <div class="row">
        <div><label for="state">State / DC</label><select id="state"></select></div>
        <div><label for="grade">Grade</label><select id="grade"></select></div>
        <div>
          <label for="label">What was this? (optional)</label>
          <input id="label" placeholder="Science homework, booklet p. 4, journal…">
        </div>
      </div>
      <label for="draft">Writing sample</label>
      <textarea id="draft" placeholder="Paste the child’s writing. This box is not stored after coaching."></textarea>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center">
        <span class="muted">We look at the writing once, then throw it away.</span>
        <button class="btn btn-primary" id="submit">Get 1–2 home practices</button>
      </div>
      <p class="error" id="err" hidden></p>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/app.js"></script>
  <script>
    window.onCoachReady = async function () {
      const user = Coach.user;
      Coach.fillGrades(document.getElementById("grade"), user && user.grade || "3");
      await Coach.fillStates(document.getElementById("state"), user && user.state || "CA");
      document.getElementById("submit").addEventListener("click", async () => {
        const err = document.getElementById("err");
        err.hidden = true;
        try {
          const result = await Coach.api("/api/coach", {
            method: "POST",
            body: JSON.stringify({
              text: document.getElementById("draft").value,
              state: document.getElementById("state").value,
              grade: document.getElementById("grade").value,
              assignment_label: document.getElementById("label").value,
              genre: "any"
            })
          });
          document.getElementById("draft").value = "";
          sessionStorage.setItem("ewc-note", JSON.stringify(result));
          location.href = result.id ? ("report.html?id=" + result.id) : "report.html";
        } catch (e) {
          err.hidden = false;
          err.innerHTML = e.status === 402
            ? 'Free coaching notes are used up. <a href="account.html">Open a family plan</a>.'
            : e.message;
        }
      });
    };
  </script>
</body>
</html>
