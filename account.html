<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved notes · Early Writing Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/coach.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="wrap">
    <div class="kicker">Household</div>
    <h1 class="page-title">Skill notes you can take to school</h1>
    <p class="lede">These records name what you have been reinforcing at home. They never include the child’s writing. Download any note you still need on paper or on your computer.</p>
    <div id="account"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/app.js"></script>
  <script>
    window.onCoachReady = async function () {
      const root = document.getElementById("account");
      const plans = await Coach.api("/api/plans");
      function planCards(current) {
        return Object.entries(plans).map(([id, p]) => `
          <div class="plan ${current === id ? "active" : ""}">
            <div class="kicker">${p.name}</div>
            <div class="price">${p.price_month ? "$" + p.price_month + "/mo" : "Free"}</div>
            <p class="muted">${p.blurb}</p>
            ${id === "free" ? "" : `<button class="btn btn-primary" data-plan="${id}" style="margin-top:12px">${current === id ? "Current plan" : "Activate demo"}</button>`}
          </div>`).join("");
      }
      if (!Coach.user) {
        root.innerHTML = `
          <div class="grid grid-2" style="margin-top:1.5rem">
            <form class="card" id="register">
              <h2>Create account</h2>
              <div style="margin-top:12px"><label>Your name</label><input name="name" required></div>
              <div style="margin-top:12px"><label>Writer’s name</label><input name="writer_name"></div>
              <div style="margin-top:12px"><label>Email</label><input name="email" type="email" required></div>
              <div style="margin-top:12px"><label>Password</label><input name="password" type="password" minlength="6" required></div>
              <div class="row">
                <div><label>State</label><select name="state" id="reg-state"></select></div>
                <div><label>Grade</label><select name="grade" id="reg-grade"></select></div>
              </div>
              <button class="btn btn-primary btn-wide">Create account</button>
              <p class="error" id="reg-err" hidden></p>
            </form>
            <form class="card" id="login">
              <h2>Sign in</h2>
              <div style="margin-top:12px"><label>Email</label><input name="email" type="email" required></div>
              <div style="margin-top:12px"><label>Password</label><input name="password" type="password" required></div>
              <button class="btn btn-secondary btn-wide" style="margin-top:16px">Sign in</button>
              <p class="error" id="login-err" hidden></p>
            </form>
          </div>
          <h2 style="margin:2rem 0 1rem">Plans</h2>
          <div class="grid grid-3">${planCards("free")}</div>`;
        Coach.fillGrades(document.getElementById("reg-grade"), "3");
        await Coach.fillStates(document.getElementById("reg-state"), "CA");
        document.getElementById("register").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          try {
            await Coach.api("/api/auth/register", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
            location.reload();
          } catch (e) {
            const err = document.getElementById("reg-err");
            err.hidden = false; err.textContent = e.message;
          }
        });
        document.getElementById("login").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          try {
            await Coach.api("/api/auth/login", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
            location.reload();
          } catch (e) {
            const err = document.getElementById("login-err");
            err.hidden = false; err.textContent = e.message;
          }
        });
        return;
      }
      const left = Coach.user.remaining_notes;
      const history = await Coach.api("/api/notes");
      root.innerHTML = `
        <div class="card" style="margin:1.5rem 0">
          <p>Signed in as <strong>${Coach.user.email}</strong> · ${Coach.user.plan}
            ${left == null ? "· unlimited notes" : "· " + left + " free notes left"}</p>
          <p class="muted">Account storage is recommendations only. Writing samples are never in this list.</p>
          <form id="profile" class="row" style="margin-top:1rem">
            <div><label>Writer</label><input name="writer_name" value="${Coach.user.writer_name || ""}"></div>
            <div><label>State</label><select name="state" id="me-state"></select></div>
            <div><label>Grade</label><select name="grade" id="me-grade"></select></div>
          </form>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn btn-primary" id="save">Save profile</button>
            <button class="btn btn-secondary" id="logout">Sign out</button>
          </div>
        </div>
        <h2 style="margin:1rem 0">Plans</h2>
        <div class="grid grid-3">${planCards(Coach.user.plan)}</div>
        <h2 style="margin:2rem 0 1rem">Saved coaching notes</h2>
        <p class="muted" style="margin-bottom:1rem">Open a note and use Save this note if you still need a file on your computer.</p>
        <div class="grid">${history.notes.map((n) => `
          <a class="card" href="report.html?id=${n.id}" style="text-decoration:none;color:inherit">
            <div class="kicker">${n.saved_on_device ? "Saved on your device" : "Save a copy"}</div>
            <h2 style="font-size:20px">${n.assignment_label || "School assignment"}</h2>
            <p class="muted">Grade ${n.grade} · ${n.state} · ${(n.titles || []).join(" · ")}</p>
          </a>`).join("") || "<p class='muted'>None yet.</p>"}</div>`;
      Coach.fillGrades(document.getElementById("me-grade"), Coach.user.grade);
      await Coach.fillStates(document.getElementById("me-state"), Coach.user.state);
      document.getElementById("save").onclick = async () => {
        await Coach.api("/api/me", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(document.getElementById("profile")).entries())) });
      };
      document.getElementById("logout").onclick = async () => {
        await Coach.api("/api/auth/logout", { method: "POST", body: "{}" });
        location.reload();
      };
      root.querySelectorAll("[data-plan]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (btn.textContent === "Current plan") return;
          await Coach.api("/api/subscribe", { method: "POST", body: JSON.stringify({ plan: btn.dataset.plan }) });
          location.reload();
        });
      });
    };
  </script>
</body>
</html>
